name: 'OmniBreach DAST & ASPM Security Scanner'
description: 'Next-Gen DAST, Smart Git-Diff Incremental Scanning (<30s PR Gate) and OASIS SARIF v2.1.0 exporter for GitHub Security.'
author: 'OmniBreach Team'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target-url:
    description: 'Target base URL to scan (e.g. https://staging.myapp.com)'
    required: true
  git-diff:
    description: 'Base git branch/ref to compare against for surgical incremental scanning (e.g. origin/main)'
    required: false
    default: 'origin/main'
  gate-severity:
    description: 'Quality Gate minimum severity threshold to block the build (critical, high, medium, low)'
    required: false
    default: 'high'
  sarif-output:
    description: 'Path where the OASIS SARIF v2.1.0 report will be saved'
    required: false
    default: 'omnibreach-results.sarif'
  pr-comment-output:
    description: 'Path where the formatted Pull Request Markdown comment will be saved'
    required: false
    default: 'omnibreach-pr-comment.md'
  profile:
    description: 'Scan profile (passive, normal, aggressive)'
    required: false
    default: 'normal'
  active-crawl:
    description: 'Enable Active Monkey Testing and CDP Network Interception'
    required: false
    default: 'false'

outputs:
  gate-passed:
    description: 'Whether the DevSecOps Quality Gate passed (true/false)'
    value: ${{ steps.scan-step.outputs.gate_passed }}
  sarif-path:
    description: 'Path to the generated SARIF report file'
    value: ${{ inputs.sarif-output }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install OmniBreach Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Execute OmniBreach Security Scan
      id: scan-step
      shell: bash
      run: |
        EXTRA_FLAGS=""
        if [ "${{ inputs.active-crawl }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --active-crawl"
        fi

        python ${{ github.action_path }}/main.py "${{ inputs.target-url }}" \
          --git-diff "${{ inputs.git-diff }}" \
          --gate-severity "${{ inputs.gate-severity }}" \
          --incremental-sarif "${{ inputs.sarif-output }}" \
          --pr-comment-out "${{ inputs.pr-comment-output }}" \
          --profile "${{ inputs.profile }}" \
          $EXTRA_FLAGS

    - name: Upload SARIF to GitHub Code Scanning
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: omnibreach-dast
