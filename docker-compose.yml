version: "3.9"

services:
  api:
    build: .
    container_name: vulnscanner-api
    ports:
      - "8000:8000"
    environment:
      - VULNSCANNER_DB=/app/reports/tasks.db
    volumes:
      - vulnscanner_reports:/app/reports
    restart: unless-stopped

  cli:
    build: .
    container_name: vulnscanner-cli
    entrypoint: ["python", "main.py"]
    profiles: ["cli"]
    environment:
      - VULNSCANNER_DB=/app/reports/tasks.db
    volumes:
      - vulnscanner_reports:/app/reports

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: vulnscanner-worker
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - VULNSCANNER_DB=/app/reports/tasks.db
      - SCANNER_WORKER_CONCURRENCY=4
    volumes:
      - vulnscanner_reports:/app/reports
    restart: unless-stopped
    depends_on:
      - api

volumes:
  vulnscanner_reports:
