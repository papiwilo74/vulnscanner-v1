[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibreach"
version = "3.8"
description = "OmniBreach — Escáner DAST y Cartografía de Superficie de Ataque (Proyecto de Portafolio / Opción de Grado)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "OmniBreach Security Team" }
]
keywords = ["security", "scanner", "vulnerability", "easm", "ctem", "pentest", "cybersecurity", "dast", "sbom", "attack-graph"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "scikit-learn>=1.0",
    "joblib>=1.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "reportlab>=4.0.0",
    "responses>=0.23.0",
    "httpx>=0.25.0",
    "types-requests>=2.31.0",
    "types-urllib3>=1.26.0",
    "types-colorama>=0.4.15",
]

[project.urls]
Homepage = "https://github.com/papiwilo74/vulnscanner-v1"
"Bug Tracker" = "https://github.com/papiwilo74/vulnscanner-v1/issues"
Documentation = "https://github.com/papiwilo74/vulnscanner-v1#readme"

[project.scripts]
omnibreach = "main:main"
vulnscanner = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-urllib3>=1.26.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient.*",
    "ignore::DeprecationWarning:starlette.testclient.*",
    "ignore::UserWarning:sklearn.*",
    "ignore::UserWarning:joblib.*",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = ["tests/*", "reports/*", "models/*", "venv/*", ".venv/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
extend-exclude = ["reports", ".venv", "venv", "env"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM",
]
ignore = ["E501", "B904", "SIM108"]

[tool.mypy]
python_version = "3.10"
files = ["scanner", "utils", "api.py", "main.py", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
exclude = ["reports/", "models/", "venv/", ".venv/"]

[[tool.mypy.overrides]]
module = "scanner.*"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "requests.*",
    "urllib3.*",
    "colorama.*",
    "joblib.*",
    "playwright.*",
    "defusedxml.*",
    "reportlab.*",
    "yaml",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.setuptools]
py-modules = ["main", "api"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*", "utils*"]

