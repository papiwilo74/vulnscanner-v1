[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vulnscanner"
version = "2.0.0"
description = "Escáner de vulnerabilidades web modular con soporte de IA, modo sigiloso y reportes HTML/JSON"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "villa" }
]
keywords = ["security", "scanner", "vulnerability", "web", "pentest", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "colorama>=0.4.6",
    "scikit-learn>=1.0",
    "joblib>=1.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/papiwilo74/vulnscanner-v1"
"Bug Tracker" = "https://github.com/papiwilo74/vulnscanner-v1/issues"
Documentation = "https://github.com/papiwilo74/vulnscanner-v1#readme"

[project.scripts]
vulnscanner = "main:scan"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-urllib3>=1.26.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
branch = true
omit = ["tests/*", "reports/*", "models/*", "venv/*", ".venv/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
extend-exclude = ["reports", ".venv", "venv", "env"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM",
]
ignore = ["E501", "B904", "SIM108"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
exclude = ["reports/", "models/", "venv/", ".venv/"]

[[tool.mypy.overrides]]
module = "scanner.*"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "joblib.*",
    "playwright.*",
    "defusedxml.*",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*", "utils*"]
